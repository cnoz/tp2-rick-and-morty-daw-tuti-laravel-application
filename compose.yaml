services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-rick_and_morty}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-laravel_local}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_local}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  vendor:
